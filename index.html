<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="">
    <script src="script.js" defer></script>
    <title>Etch a sketch</title>
</head>
<body>
    <h1 class="header"><i>Etch a Sketch</i></h1>
    <div class="main-container">
        <div class="first-container">
            <p class="size-of-grid">This is a 4 x 4 grid</p>
            <p class="sentence">Type a number below for a different grid e.g 10</p>
            <label for="grid-choice">Grid Choice</label>
            <div class="grid-container">
                <input type="text" id="grid-choice" name="grid-choice" required>
                <button class="submit">Submit</button>
            </div>
        </div>
        <div class="second-container"></div>
    </div>
</body>
</html>
